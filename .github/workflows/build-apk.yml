name: Build NMEA Bridge APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Kotlin APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NMEA-Bridge-Android-Kotlin-v0.2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build and sign release APK (only if signing secrets are configured)
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not present; continuing with the original debug APK build."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nmea-bridge-release.p12"
          chmod 600 "$RUNNER_TEMP/nmea-bridge-release.p12"
          gradle --no-daemon :app:assembleRelease
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/nmea-bridge-aligned.apk"
          SIGNED="app/build/outputs/apk/release/NMEA-Bridge-Android-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/nmea-bridge-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias nmea_bridge \
            --ks-pass env:ANDROID_SIGNING_PASSWORD \
            --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          rm -f "$RUNNER_TEMP/nmea-bridge-release.p12" "$ALIGNED"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: NMEA-Bridge-signed-release-APK
          path: app/build/outputs/apk/release/NMEA-Bridge-Android-signed.apk
          if-no-files-found: error
